<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peralatan — PKN CMS</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PKN CMS">
    <meta name="theme-color" content="#1B5EA6">
    <link rel="apple-touch-icon" href="assets/img/icon-192.png">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/pages/equipment.css">
</head>
<body class="pkn-body" data-page="equipment">
<div class="pkn-loading" id="pknLoading">
    <div class="loading-content">
        <img src="assets/img/logo.svg" alt="PKN" class="loading-logo" onerror="this.style.display='none'">
        <div class="loading-brand">PKN CMS</div>
        <div class="loading-spinner"><div class="spinner-ring"></div></div>
        <div class="loading-text">Memuat data peralatan...</div>
    </div>
</div>
<div class="pkn-app" id="pknApp">
    <div id="sidebarMount"></div>
    <div class="pkn-main" id="pknMain">
        <div id="headerMount"></div>
        <main class="pkn-content" id="pknContent">

            <div class="pkn-page-header">
                <div class="page-title-group">
                    <div class="page-eyebrow"><i class="fas fa-tools"></i> Peralatan</div>
                    <h1 class="page-title">Manajemen Peralatan</h1>
                    <p class="page-subtitle">Monitor kondisi dan penggunaan alat berat proyek</p>
                </div>
                <div class="page-actions">
                    <button class="btn-pkn btn-pkn-ghost btn-pkn-sm" onclick="exportEquipment()"><i class="fas fa-file-excel"></i> Export</button>
                    <button class="btn-pkn btn-pkn-accent" onclick="openAddEquipment()"><i class="fas fa-plus"></i> Tambah Alat</button>
                </div>
            </div>

            <!-- Stats -->
            <div class="row g-3 mb-4">
                <div class="col-6 col-md-3">
                    <div class="stat-card" style="--stat-color:#1a3a5c;--stat-bg:rgba(26,58,92,.08)">
                        <div class="stat-icon-wrap"><i class="fas fa-tools"></i></div>
                        <div class="stat-body"><div class="stat-value" id="statTotalEq">0</div><div class="stat-label">Total Alat</div></div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat-card" style="--stat-color:#27ae60;--stat-bg:rgba(39,174,96,.08)">
                        <div class="stat-icon-wrap"><i class="fas fa-check-circle"></i></div>
                        <div class="stat-body"><div class="stat-value" id="statBaikEq">0</div><div class="stat-label">Kondisi Baik</div></div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat-card" style="--stat-color:#e8a020;--stat-bg:rgba(232,160,32,.08)">
                        <div class="stat-icon-wrap"><i class="fas fa-wrench"></i></div>
                        <div class="stat-body"><div class="stat-value" id="statServisEq">0</div><div class="stat-label">Dalam Servis</div></div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat-card" style="--stat-color:#e74c3c;--stat-bg:rgba(231,76,60,.08)">
                        <div class="stat-icon-wrap"><i class="fas fa-times-circle"></i></div>
                        <div class="stat-body"><div class="stat-value" id="statRusakEq">0</div><div class="stat-label">Rusak</div></div>
                    </div>
                </div>
            </div>

            <!-- Equipment Cards -->
            <div class="pkn-filter-row pkn-card mb-3" style="border-radius:var(--radius-lg)">
                <span class="filter-label"><i class="fas fa-filter"></i> Filter</span>
                <select class="filter-select" id="filterEqProject" onchange="renderEquipment()">
                    <option value="">Semua Proyek</option>
                    <option>Gedung Perkantoran Tower A</option><option>Jembatan Layang Kelapa Gading</option>
                    <option>Perumahan Grand PKN Residence</option><option>Renovasi Gedung B Pemda</option>
                </select>
                <select class="filter-select" id="filterEqCond" onchange="renderEquipment()">
                    <option value="">Semua Kondisi</option>
                    <option value="Baik">Baik</option><option value="Cukup">Cukup</option>
                    <option value="Servis">Servis</option><option value="Rusak">Rusak</option>
                </select>
                <div class="pkn-search ms-auto">
                    <i class="fas fa-search pkn-search-icon"></i>
                    <input type="text" class="pkn-search-input" id="searchEquipment" placeholder="Cari alat..." oninput="renderEquipment()">
                </div>
            </div>

            <div class="row g-3" id="equipmentGrid"></div>
            <div id="emptyEquipment" class="pkn-empty" style="display:none">
                <div class="pkn-empty-icon"><i class="fas fa-tools"></i></div>
                <div class="pkn-empty-title">Belum ada data peralatan</div>
            </div>

        </main>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="equipmentModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content" style="border-radius:var(--radius-lg);border:1px solid var(--pkn-border)">
            <div class="modal-header" style="border-bottom:1px solid var(--pkn-border-light);padding:18px 24px">
                <h5 class="modal-title" id="eqModalTitle"><i class="fas fa-tools me-2 text-pkn"></i>Tambah Peralatan</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" style="padding:24px">
                <div class="row g-3">
                    <div class="col-md-6"><div class="pkn-form-group"><label class="pkn-form-label">Nama Alat <span class="required">*</span></label><input type="text" class="pkn-form-control" id="eqName" placeholder="Nama peralatan"></div></div>
                    <div class="col-md-6"><div class="pkn-form-group"><label class="pkn-form-label">Tipe / Model</label><input type="text" class="pkn-form-control" id="eqModel" placeholder="Model / tipe alat"></div></div>
                    <div class="col-md-6"><div class="pkn-form-group"><label class="pkn-form-label">Proyek</label>
                        <select class="pkn-form-control" id="eqProject">
                            <option>Gedung Perkantoran Tower A</option><option>Jembatan Layang Kelapa Gading</option>
                            <option>Perumahan Grand PKN Residence</option><option>Renovasi Gedung B Pemda</option>
                        </select></div></div>
                    <div class="col-md-3"><div class="pkn-form-group"><label class="pkn-form-label">Jumlah</label><input type="number" class="pkn-form-control" id="eqQty" value="1" min="1"></div></div>
                    <div class="col-md-3"><div class="pkn-form-group"><label class="pkn-form-label">Kondisi</label>
                        <select class="pkn-form-control" id="eqCond">
                            <option value="Baik">✅ Baik</option><option value="Cukup">⚠️ Cukup</option>
                            <option value="Servis">🔧 Servis</option><option value="Rusak">❌ Rusak</option>
                        </select></div></div>
                    <div class="col-md-6"><div class="pkn-form-group"><label class="pkn-form-label">Operator</label><input type="text" class="pkn-form-control" id="eqOperator" placeholder="Nama operator"></div></div>
                    <div class="col-md-3"><div class="pkn-form-group"><label class="pkn-form-label">Jam Kerja/Hari</label><input type="number" class="pkn-form-control" id="eqHours" value="8" min="0" max="24"></div></div>
                    <div class="col-md-3"><div class="pkn-form-group"><label class="pkn-form-label">Service Berikutnya</label><input type="date" class="pkn-form-control" id="eqNextService"></div></div>
                    <div class="col-12"><div class="pkn-form-group"><label class="pkn-form-label">Catatan</label><textarea class="pkn-form-control" id="eqNotes" rows="2" placeholder="Catatan kondisi atau perbaikan..."></textarea></div></div>
                </div>
            </div>
            <div class="modal-footer" style="border-top:1px solid var(--pkn-border-light);padding:16px 24px">
                <button type="button" class="btn-pkn btn-pkn-ghost" data-bs-dismiss="modal">Batal</button>
                <button type="button" class="btn-pkn btn-pkn-primary" onclick="saveEquipment()"><i class="fas fa-save me-1"></i>Simpan</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
<script src="assets/js/sidebar-template.js"></script>
<script src="assets/js/header-template.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/equipment.js"></script>
<script src="assets/js/app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(reg => console.log("[PKN] SW registered:", reg.scope))
      .catch(err => console.warn("[PKN] SW failed:", err));
  });
}
</script>
</body>
</html>
