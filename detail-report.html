<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Laporan — PKN CMS</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PKN CMS">
    <meta name="theme-color" content="#1B5EA6">
    <link rel="apple-touch-icon" href="assets/img/icon-192.png">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/pages/detail-report.css">
</head>
<body class="pkn-body" data-page="detail-report">
<div class="pkn-loading" id="pknLoading">
    <div class="loading-content">
        <img src="assets/img/logo.svg" alt="PKN" class="loading-logo" onerror="this.style.display='none'">
        <div class="loading-brand">PKN CMS</div>
        <div class="loading-spinner"><div class="spinner-ring"></div></div>
        <div class="loading-text">Memuat detail...</div>
    </div>
</div>
<div class="pkn-app" id="pknApp">
    <div id="sidebarMount"></div>
    <div class="pkn-main" id="pknMain">
        <div id="headerMount"></div>
        <main class="pkn-content" id="pknContent">

            <!-- Header -->
            <div class="pkn-page-header">
                <div class="page-title-group">
                    <div class="page-eyebrow"><a href="reports.html" style="color:var(--pkn-accent);text-decoration:none"><i class="fas fa-arrow-left"></i> Kembali</a></div>
                    <h1 class="page-title" id="detailReportNum">Detail Laporan</h1>
                    <p class="page-subtitle" id="detailSubtitle">Memuat data...</p>
                </div>
                <div class="page-actions">
                    <button class="btn-pkn btn-pkn-ghost btn-pkn-sm" onclick="window.print()">
                        <i class="fas fa-print"></i> Print
                    </button>
                    <button class="btn-pkn btn-pkn-primary" onclick="exportPDF()">
                        <i class="fas fa-file-pdf"></i> Export PDF
                    </button>
                </div>
            </div>

            <!-- Report Card -->
            <div id="reportDetailContent">
                <!-- Injected by JS -->
            </div>

        </main>
    </div>
</div>

<!-- PDF Print area -->
<div id="pdfPrintArea" style="display:none"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
<script src="assets/js/sidebar-template.js"></script>
<script src="assets/js/header-template.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/detail-report.js"></script>
<script src="assets/js/app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(reg => console.log("[PKN] SW registered:", reg.scope))
      .catch(err => console.warn("[PKN] SW failed:", err));
  });
}
</script>
</body>
</html>
