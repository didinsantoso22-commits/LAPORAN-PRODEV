<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users — PKN CMS</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PKN CMS">
    <meta name="theme-color" content="#1B5EA6">
    <link rel="apple-touch-icon" href="assets/img/icon-192.png">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="pkn-body" data-page="users">
<div class="pkn-loading" id="pknLoading">
    <div class="loading-content"><img src="assets/img/logo.svg" alt="PKN" class="loading-logo" onerror="this.style.display='none'"><div class="loading-brand">PKN CMS</div><div class="loading-spinner"><div class="spinner-ring"></div></div><div class="loading-text">Memuat users...</div></div>
</div>
<div class="pkn-app" id="pknApp">
    <div id="sidebarMount"></div>
    <div class="pkn-main" id="pknMain">
        <div id="headerMount"></div>
        <main class="pkn-content" id="pknContent">
            <div class="pkn-page-header">
                <div class="page-title-group">
                    <div class="page-eyebrow"><i class="fas fa-users"></i> Users</div>
                    <h1 class="page-title">Manajemen User</h1>
                    <p class="page-subtitle">Kelola akun pengguna dan hak akses sistem</p>
                </div>
                <div class="page-actions">
                    <button class="btn-pkn btn-pkn-accent" onclick="openAddUser()"><i class="fas fa-plus"></i> Tambah User</button>
                </div>
            </div>
            <div class="pkn-card">
                <div class="pkn-filter-row">
                    <span class="filter-label"><i class="fas fa-filter"></i> Filter</span>
                    <select class="filter-select" id="filterRole" onchange="renderUsers()">
                        <option value="">Semua Role</option>
                        <option value="Administrator">Administrator</option>
                        <option value="Project Manager">Project Manager</option>
                        <option value="Site Supervisor">Site Supervisor</option>
                        <option value="Operator">Operator</option>
                    </select>
                    <div class="pkn-search ms-auto"><i class="fas fa-search pkn-search-icon"></i><input type="text" class="pkn-search-input" id="searchUser" placeholder="Cari user..." oninput="renderUsers()"></div>
                </div>
                <div class="pkn-card-body p-0">
                    <div class="pkn-table-wrap" style="border:none">
                        <table class="pkn-table">
                            <thead><tr><th>No</th><th>Nama</th><th>Username</th><th>Role</th><th>Status</th><th>Login Terakhir</th><th>Aksi</th></tr></thead>
                            <tbody id="usersTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<!-- Modal -->
<div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius:var(--radius-lg);border:1px solid var(--pkn-border)">
            <div class="modal-header" style="border-bottom:1px solid var(--pkn-border-light);padding:18px 24px">
                <h5 class="modal-title" id="userModalTitle"><i class="fas fa-user-plus me-2 text-pkn"></i>Tambah User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" style="padding:24px">
                <div class="row g-3">
                    <div class="col-12"><div class="pkn-form-group"><label class="pkn-form-label">Nama Lengkap <span class="required">*</span></label><input type="text" class="pkn-form-control" id="uName" placeholder="Nama lengkap"></div></div>
                    <div class="col-md-6"><div class="pkn-form-group"><label class="pkn-form-label">Username <span class="required">*</span></label><input type="text" class="pkn-form-control" id="uUsername" placeholder="Username unik"></div></div>
                    <div class="col-md-6"><div class="pkn-form-group"><label class="pkn-form-label">Password</label><input type="password" class="pkn-form-control" id="uPassword" placeholder="Min. 6 karakter"></div></div>
                    <div class="col-md-6"><div class="pkn-form-group"><label class="pkn-form-label">Role</label>
                        <select class="pkn-form-control" id="uRole">
                            <option>Administrator</option><option>Project Manager</option>
                            <option>Site Supervisor</option><option>Operator</option><option>Viewer</option>
                        </select></div></div>
                    <div class="col-md-6"><div class="pkn-form-group"><label class="pkn-form-label">Status</label>
                        <select class="pkn-form-control" id="uStatus"><option value="aktif">Aktif</option><option value="nonaktif">Non-aktif</option></select>
                    </div></div>
                    <div class="col-12"><div class="pkn-form-group"><label class="pkn-form-label">Email</label><input type="email" class="pkn-form-control" id="uEmail" placeholder="email@domain.com"></div></div>
                </div>
            </div>
            <div class="modal-footer" style="border-top:1px solid var(--pkn-border-light);padding:16px 24px">
                <button type="button" class="btn-pkn btn-pkn-ghost" data-bs-dismiss="modal">Batal</button>
                <button type="button" class="btn-pkn btn-pkn-primary" onclick="saveUser()"><i class="fas fa-save me-1"></i>Simpan</button>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
<script src="assets/js/sidebar-template.js"></script>
<script src="assets/js/header-template.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/users.js"></script>
<script src="assets/js/app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(reg => console.log("[PKN] SW registered:", reg.scope))
      .catch(err => console.warn("[PKN] SW failed:", err));
  });
}
</script>
</body>
</html>
